apiVersion: v1
kind: Pod
metadata:
  name: dns-test
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-control-1
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: unschedulable
      operator: Exists
      effect: NoSchedule
  dnsPolicy: ClusterFirst
  containers:
    - name: tools
      image: busybox:1.37
      command: [sh, -c, "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
