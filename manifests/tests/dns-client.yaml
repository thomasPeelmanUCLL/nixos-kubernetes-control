apiVersion: v1
kind: Pod
metadata:
  name: dns-test
spec:
  restartPolicy: Never
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: unschedulable
      operator: Exists
      effect: NoSchedule
  containers:
    - name: tools
      image: busybox:1.37
      command:
        - sleep
        - "3600"
